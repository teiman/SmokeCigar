<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smokecigar — Quake MDL Vertex Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Error toast -->
  <div id="error-msg"></div>

  <!-- Drop zone (shown before model is loaded) -->
  <div id="drop-zone">
    <p>Drop a Quake 1 .mdl file here</p>
  </div>

  <!-- Main app (shown after model is loaded) -->
  <div id="app-content">

    <!-- 3 orthogonal canvas views -->
    <div class="panels">
      <canvas id="canvas-front"></canvas>
      <canvas id="canvas-side"></canvas>
      <canvas id="canvas-top"></canvas>
    </div>

    <!-- Controls -->
    <div class="controls">
      <label>Frame</label>
      <input type="range" id="frame-slider" min="0" max="0" value="0">
      <span id="frame-label">Frame 0</span>

      <label>Range</label>
      <input type="number" id="frame-from" min="0" value="0">
      <span>—</span>
      <input type="number" id="frame-to" min="0" value="0">

      <span id="vertex-info">No vertex selected. Click on a canvas to select one.</span>
    </div>

    <!-- Template & Output -->
    <div class="code-section">
      <div class="column">
        <h3>Template</h3>
        <textarea id="template-area">if ( self.frame==<num>)
    return <vector>;
else</textarea>
      </div>
      <div class="column">
        <h3>Output</h3>
        <textarea id="output-area" readonly></textarea>
      </div>
    </div>

    <!-- Buttons -->
    <div class="buttons">
      <button id="btn-generate" class="primary">Generate</button>
      <button id="btn-copy">Copy Output</button>
    </div>

  </div>

  <script src="js/mdl-parser.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
